<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | The Pint Club</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
</head>
<body>
    <div id="site-header"></div>
    <main class="page-shell">
        <section class="recipes-hero" aria-labelledby="home-heading">
            <p class="eyebrow">Creamy ideas</p>
            <h1 id="home-heading">Recommended pints for your next spin</h1>
            <p id="home-greeting" class="home-greeting" hidden></p>
            <p class="lede">A small, simple home page with your picks for today and the recipes you have saved in your browser.</p>
        </section>

        <section class="home-section" aria-labelledby="recommended-heading">
            <div class="section-heading">
                <h2 id="recommended-heading">Recommended</h2>
            </div>
            <div id="recommended-grid" class="recipes-grid" aria-live="polite"></div>
        </section>

        <section class="home-section" aria-labelledby="favorites-heading">
            <div class="section-heading">
                <h2 id="favorites-heading">Favorites</h2>
            </div>
            <div id="favorites-grid" class="recipes-grid" aria-live="polite"></div>
        </section>
    </main>
    <div id="site-footer"></div>
    <script src="js/components.js" defer></script>
    <script src="js/home.js" defer></script>
</body>
</html>
